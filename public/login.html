<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Digital Heroes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            margin: 20px;
        }

        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-card .logo h2 {
            font-weight: 800;
            color: #333;
        }

        .login-card .logo .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .login-card .form-control {
            border-radius: 12px;
            border: 2px solid #e8ecf1;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .login-card .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .login-card .form-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
        }

        .test-credentials {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .test-credentials small {
            color: #666;
            font-size: 0.8rem;
        }

        .test-credentials strong {
            color: #333;
        }

        .credit-footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
        }

        .credit-footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .credit-footer a:hover {
            text-decoration: underline;
        }

        .alert-custom {
            border-radius: 12px;
            border: none;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .login-icon i {
            font-size: 28px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="login-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <div class="subtitle">Sign in to your admin dashboard</div>
        </div>

        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-envelope me-2 text-primary"></i> Email
                </label>
                <input type="email" class="form-control" id="email" placeholder="admin@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-key me-2 text-primary"></i> Password
                </label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </button>
        </form>

        <div class="test-credentials">
            <small>
                <i class="fas fa-info-circle me-1"></i> Test credentials: 
                <strong>admin@example.com</strong> / <strong>admin123</strong>
            </small>
        </div>
    </div>

    <footer class="credit-footer">
        Built for Digital Heroes Training Task &nbsp;|&nbsp; 
        <a href="https://digitalheroesco.com" target="_blank">digitalheroesco.com</a>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/admin.html';
                } else {
                    document.getElementById('alertContainer').innerHTML = 
                        `<div class="alert alert-danger alert-custom">
                            <i class="fas fa-exclamation-circle me-2"></i> ${data.error || 'Invalid credentials'}
                        </div>`;
                }
            } catch (error) {
                document.getElementById('alertContainer').innerHTML = 
                    `<div class="alert alert-danger alert-custom">
                        <i class="fas fa-wifi me-2"></i> Network error
                    </div>`;
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Login';
            }
        });
    </script>
</body>
</html>
